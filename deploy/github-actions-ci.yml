name: FitSync CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build (Server & Client)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Server Unit Tests
        run: npm test tests/unit.test.js --workspace=server

      - name: Run Server Integration Tests
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/fitsync_test
          DEV_AUTH_BYPASS: 'true'
          SURPLUS_THRESHOLD: '150'
          PORT: '5001'
        run: npm test tests/integration.test.js --workspace=server

      - name: Build Client PWA
        env:
          VITE_API_URL: /api/v1
        run: npm run build --workspace=client
